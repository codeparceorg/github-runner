apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-runner-sa
  namespace: actions-runner-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: github-runner-admin
rules:
  # Permisos estándar
  - apiGroups: ["", "apps", "extensions"]
    resources: ["deployments", "services", "namespaces", "pods", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # PERMISO ESPECÍFICO PARA TRAEFIK
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes", "middlewares", "tlsoptions", "tlsstores"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Permisos para HorizontalPodAutoscalers (HPA)
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: github-runner-admin-binding
subjects:
  - kind: ServiceAccount
    name: github-runner-sa
    namespace: actions-runner-system
roleRef:
  kind: ClusterRole
  name: github-runner-admin
  apiGroup: rbac.authorization.k8s.io

